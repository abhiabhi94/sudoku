name: sudoku
description: "Sudoku - a modern, playful number puzzle game."
publish_to: 'none'
version: 1.5.0+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.1
  flutter_animate: ^4.5.0
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/

  # Google Sans Flex (OFL, static instances from Google Fonts) is bundled so
  # nothing is fetched at runtime: works offline on phones and in the
  # headless-Chromium screenshot harness. Family name is referenced from
  # lib/ui/theme.dart (kAppFontFamily).
  fonts:
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-Light.ttf
          weight: 300
        - asset: assets/fonts/GoogleSansFlex-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSansFlex-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSansFlex-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/GoogleSansFlex-Black.ttf
          weight: 900

# App launcher icon (run: dart run flutter_launcher_icons).
# Source art is generated by tool/make_icon.py.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6C5CE7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
