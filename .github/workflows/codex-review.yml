# Automated PR review by OpenAI Codex.
#
# Codex reads AGENTS.md from the checkout on its own, so the review is judged
# against the repo guidelines (the "Code review" section in particular)
# without restating them here. Changing the rules = editing AGENTS.md.
#
# Runs when a PR is opened, marked ready for review, or labelled
# `codex-review` (add the label again to re-review after new pushes; it is
# not run on every push to keep API spend predictable). Drafts are skipped.
#
# One-time setup: add the `OPENAI_API_KEY` repository secret
# (Settings -> Secrets and variables -> Actions). The action refuses to run
# for actors without write access to the repo, so a fork PR cannot spend
# the key.
name: Codex review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex review
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'codex-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      review: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Fetch base and head so Codex can diff the PR
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # Review only: Codex may run git/grep/cat but must not edit files.
          permission-profile: ":read-only"
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}.

            The repository guidelines are in AGENTS.md (already loaded).
            Follow its "Code review" section for what to check and how to
            report. Review ONLY the changes this PR introduces:

                git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
                git log --oneline ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Read surrounding code when you need context, but do not comment
            on code the PR does not touch. Do not modify any files.

            Write the review in GitHub-flavoured Markdown, starting with the
            heading "## Codex review". Be concise and specific.

            Pull request title and body:
            ----
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}

  comment:
    name: Post review
    runs-on: ubuntu-latest
    needs: review
    if: needs.review.outputs.review != ''
    permissions:
      pull-requests: write
    steps:
      - name: Post Codex review as a PR comment
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW: ${{ needs.review.outputs.review }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = process.env.CODEX_REVIEW.trim() +
              `\n\n---\n_Automated review by OpenAI Codex ` +
              `([run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}))._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
