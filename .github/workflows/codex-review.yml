# Codex PR review. The logic lives in the account-wide reusable workflow in
# abhiabhi94/.github (see its README for inputs); this file is the same in
# every repo. Needs the `OPENAI_API_KEY` repository secret. Codex reads
# AGENTS.md itself, so repo-specific review rules go there.
name: Codex review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  codex:
    uses: abhiabhi94/.github/.github/workflows/codex-review-reusable.yml@main
    secrets: inherit
