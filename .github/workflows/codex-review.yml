# Codex PR review for this repo. The logic lives in the reusable workflow
# (codex-review-reusable.yml, called by path so a PR tests its own copy);
# other repos call it as
#   uses: abhiabhi94/sudoku/.github/workflows/codex-review-reusable.yml@main
# Needs the `OPENAI_API_KEY` repository secret. Codex reads AGENTS.md itself.
name: Codex review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  codex:
    uses: ./.github/workflows/codex-review-reusable.yml
    secrets: inherit
